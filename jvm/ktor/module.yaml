product:
  type: jvm/app

apply:
  - //build-logic/templates/common.module-template.yaml

settings:
  ktor:
    version: 3.6.0
    enabled: true
  jvm:
    mainClass: AppKt

dependencies:
  - //shared
  - $libs.ktor.server.core
  - $libs.ktor.server.di
  - $libs.ktor.server.netty
  - $libs.ktor.server.swagger
  - $libs.ktor.server.routing.openapi
  - $libs.logback.classic
  - $libs.kotlinx.rpc.krpc.ktor.server
  - $libs.kotlinx.rpc.krpc.ktor.client
  - $libs.kotlinx.rpc.krpc.ser.json

test-dependencies:
  - $libs.ktor.server.test.host

plugins:
  native-image:
    enabled: true
    mainClass: AppKt
    additionalArgs:
      - --enable-preview
      - --future-defaults=all
      - --enable-native-access=ALL-UNNAMED
      - -H:MaxHeapSize=64m
      - -H:+UnlockExperimentalVMOptions
      - -H:+ReportExceptionStackTraces
      - -H:+StrictRuntimeJavaOptions
      - -Werror
      - -O3
      - -march=compatibility
      # - -H:+RuntimeClassLoading
      # - -H:+GraalJITCompileAtRuntime
      # - --enable-monitoring=heapdump,jfr,jvmstat,threaddump,nmt,jcmd

# OpenTelemetry declarative SDK and Java agent configuration.
# Activated via -Dotel.config.file=... or OTEL_CONFIG_FILE=...
#
# NOTE: When declarative config is active, SDK/instrumentation OTEL_* env vars and
# system properties are ignored except where referenced via ${VAR} below
# (and agent-only flags such as otel.javaagent.enabled / debug / extensions).
#
# Schema reference: https://opentelemetry.io/docs/specs/otel-config/types/
file_format: "1.2"
disabled: ${OTEL_SDK_DISABLED:-false}
log_level: ${OTEL_LOG_LEVEL:-info}

resource:
  attributes:
    - name: service.name
      value: ${OTEL_SERVICE_NAME:-ktor-app}
    - name: service.namespace
      value: ${OTEL_SERVICE_NAMESPACE:-kmp-play}
    - name: deployment.environment.name
      value: ${OTEL_DEPLOYMENT_ENVIRONMENT:-dev}
  attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}
  detection/development:
    detectors:
      - container:
      - host:
      - process:

propagator:
  composite:
    - tracecontext:
    - baggage:

tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
            compression: gzip
  sampler:
    composite/development:
      parent_threshold:
        root:
          rule_based:
            rules:
              - span_kinds:
                  - server
                attribute_patterns:
                  key: url.path
                  included:
                    - /docs
                    - /docs/*
                sampler:
                  always_off:
              - sampler:
                  always_on:
    # Requires io.opentelemetry.contrib:opentelemetry-cel-sampler as a javaagent extension:
    # parent_based:
    #   root:
    #     cel_based:
    #       fallback_sampler:
    #         always_on:
    #       expressions:
    #         - action: DROP
    #           expression: spanKind == 'SERVER' && attribute['url.path'].startsWith('/health')
    #         - action: RECORD_AND_SAMPLE
    #           expression: spanKind == 'SERVER' && attribute['http.request.method'] == 'GET'

meter_provider:
  readers:
    - periodic:
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
            compression: gzip

logger_provider:
  processors:
    - batch:
        exporter:
          otlp_grpc:
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
            compression: gzip

distribution:
  javaagent:
    instrumentation:
      enabled:
        # Disabled by default in 3.0 / v3_preview; enables @WithSpan on Kotlin suspend functions.
        - kotlinx_coroutines_annotations

instrumentation/development:
  java:
    common:
      # Preview 3.0 defaults on Java agent 2.32.0-2.34.0; remove once upgraded to 3.0.0 GA.
      v3_preview: true
      http:
        server:
          emit_experimental_telemetry/development: true
        client:
          emit_experimental_telemetry/development: true
      logging:
        # In 3.0, structured log attributes (SLF4J 2.x KVPs, Logstash markers/args) are captured by default.
        structured_attributes:
          excluded:
            - "*secret*"
    runtime_telemetry:
      emit_experimental_metrics/development: true
      emit_experimental_jfr_metrics/development: true
    logback_appender:
      mdc_attributes/development:
        included:
          - "*"
        excluded:
          - "*secret*"
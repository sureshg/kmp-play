name: CI

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - LICENSE
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      task:
        description: 'Kotlin task to run'
        required: false
        default: package
        type: choice
        options:
          - package
          - build

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  KOTLIN_TASK: ${{ inputs.task || 'package' }}

jobs:
  build:
    name: 🔨 Build & Release
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🅺 Cache Kotlin Toolchain
        uses: sureshg/actions/kotlin-toolchain-cache@v1
        with:
          konan: ${{ env.KOTLIN_TASK == 'build' }}

      - name: 🏗️ Build
        run: |
          if [ "$KOTLIN_TASK" = "build" ]; then
            ./kotlin build -v release
            ./build/tasks/_macos_linkMacosArm64Release/macos.kexe
          else
            ./kotlin package
            ./kotlin build -m wasm -v release
            mkdir -p dist/wasmjs
            cp -R build/tasks/_wasm_buildWasmJsAppWasmJsRelease/* dist/wasmjs/
          fi

      - name: 📄 Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 🔭 Upload OpenTelemetry traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin_cli_traces.jsonl
          path: build/logs/amper_*_${{ env.KOTLIN_TASK }}/telemetry/amper_cli_traces.jsonl
          archive: false
          if-no-files-found: ignore

      - name: ☕ Upload app-jvm
        uses: actions/upload-artifact@v7
        with:
          name: app-jvm.jar
          path: build/tasks/_app_jarJvm/app-jvm.jar
          archive: false
          if-no-files-found: error

      - name: 🐧 Upload linux-x64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-linux-x64.zip
          path: build/tasks/_linux_linkLinuxX64Release/linux.kexe
          if-no-files-found: error

      - name: 🐧 Upload linux-arm64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-linux-arm64.zip
          path: build/tasks/_linux_linkLinuxArm64Release/linux.kexe
          if-no-files-found: error

      - name: 🍎 Upload macos-arm64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-macos-arm64.zip
          path: build/tasks/_macos_linkMacosArm64Release/macos.kexe
          if-no-files-found: error

      - name: 🪟 Upload windows-x64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-windows-x64.zip
          path: build/tasks/_windows_linkMingwX64Release/windows.exe
          if-no-files-found: error

  deploy-pages:
    name: 🚀 Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

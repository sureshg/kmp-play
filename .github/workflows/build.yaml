name: CI

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - LICENSE
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      task:
        description: 'Kotlin task to run'
        required: false
        default: package
        type: choice
        options:
          - package
          - build

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_BOOTSTRAP_CACHE_DIR: ${{ github.workspace }}/.kotlin/boot-cache
  KOTLIN_SHARED_CACHE_DIR: ${{ github.workspace }}/.kotlin/shared-cache
  KOTLIN_TASK: ${{ inputs.task || 'package' }}
# KOTLIN_CLI_NO_WELCOME_BANNER: 1
# KOTLIN_CLI_JAVA_OPTIONS: --enable-preview
# KOTLIN_CLI_JAVA_HOME: ...
# KOTLIN_CLI_DOWNLOAD_ROOT: ...
# KOTLIN_DEFAULT_MAVEN_CENTRAL_URL: https://cache-redirector.jetbrains.com/repo.maven.apache.org/maven2

jobs:
  build:
    name: 🔨 Build & Release
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: ⚡ Cache Kotlin CLI bootstrap
        uses: actions/cache@v5
        with:
          path: ${{ env.KOTLIN_CLI_BOOTSTRAP_CACHE_DIR }}
          key: kotlin-boot-${{ runner.os }}-${{ hashFiles('kotlin', 'kotlin.bat') }}

      - name: 🛠️ Cache toolchains & JDKs
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.KOTLIN_SHARED_CACHE_DIR }}/download.cache
            ${{ env.KOTLIN_SHARED_CACHE_DIR }}/extract.cache
          key: kotlin-shared-downloads-${{ runner.os }}-${{ hashFiles('project.yaml', '**/module.yaml', '**/plugin.yaml', 'kotlin', 'kotlin.bat', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-shared-downloads-${{ runner.os }}-

      - name: 📦 Cache Maven & Kotlin dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.KOTLIN_SHARED_CACHE_DIR }}/.m2.cache
            ${{ env.KOTLIN_SHARED_CACHE_DIR }}/kotlin
          enableCrossOsArchive: true
          key: kotlin-shared-dependencies-${{ hashFiles('project.yaml', '**/module.yaml', '**/plugin.yaml', 'kotlin', 'kotlin.bat', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-shared-dependencies-

      - name: 🗂️ Cache build outputs
        uses: actions/cache@v5
        with:
          path: |
            build/*
            !build/logs
          key: kotlin-project-${{ runner.os }}-${{ hashFiles('project.yaml', '**/module.yaml', '**/plugin.yaml', 'kotlin', 'kotlin.bat', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-project-${{ runner.os }}-

      - name: 🅺 Extract Kotlin version
        if: env.KOTLIN_TASK == 'build'
        run: |
          echo "KOTLIN_VERSION=$(grep '^kotlin ' libs.versions.toml | sed 's/.*= *"\(.*\)"/\1/')" >> $GITHUB_ENV

      - name: ⚙️ Cache Kotlin/Native toolchains
        if: env.KOTLIN_TASK == 'build'
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ env.KOTLIN_VERSION }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: 🏗️ Build
        run: |
          if [ "$KOTLIN_TASK" = "build" ]; then
            ./kotlin build -v release
            ./build/tasks/_macos_linkMacosArm64Release/macos.kexe
          else
            ./kotlin package
          fi

      - name: 🔭 Upload OpenTelemetry traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin_cli_traces.jsonl
          path: build/logs/amper_*_${{ env.KOTLIN_TASK }}/telemetry/amper_cli_traces.jsonl
          archive: false
          if-no-files-found: ignore

      - name: ☕ Upload app-jvm
        uses: actions/upload-artifact@v7
        with:
          name: app-jvm.jar
          path: build/tasks/_app_jarJvm/app-jvm.jar
          archive: false
          if-no-files-found: error

      - name: 🐧 Upload linux-x64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-linux-x64.zip
          path: build/tasks/_linux_linkLinuxX64Release/linux.kexe
          if-no-files-found: error

      - name: 🐧 Upload linux-arm64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-linux-arm64.zip
          path: build/tasks/_linux_linkLinuxArm64Release/linux.kexe
          if-no-files-found: error

      - name: 🍎 Upload macos-arm64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-macos-arm64.zip
          path: build/tasks/_macos_linkMacosArm64Release/macos.kexe
          if-no-files-found: error

      - name: 🪟 Upload windows-x64
        if: env.KOTLIN_TASK == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: app-windows-x64.zip
          path: build/tasks/_windows_linkMingwX64Release/windows.exe
          if-no-files-found: error

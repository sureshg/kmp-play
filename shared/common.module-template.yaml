repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: false
    publish: true
# - id: kotlin-dev
#   url: https://packages.jetbrains.team/maven/p/kt/bootstrap
#
# - id: mavenCentral
#   url: https://repo.maven.apache.org/maven2/
#
# - id: mavenSnapshot
#   url: https://central.sonatype.com/repository/maven-snapshots/
#
# - id: gradle
#   url: https://cache-redirector.jetbrains.com/plugins.gradle.org/m2

settings:
  jvm:
    # release: 26
    storeParameterNames: true
    jdk:
      version: 26
      distributions: [ oracleOpenJdk, zulu ]
      # selectionMode: javaHome

  kotlin:
    version: 2.4.0
    languageVersion: 2.4
    apiVersion: 2.4
    progressiveMode: true
    powerAssert: enabled
    allWarningsAsErrors: false
    suppressWarnings: false
    verbose: false
    freeCompilerArgs:
      - -Wextra
      - -Xcollection-literals
      - -Xexpect-actual-classes
      - -Xreport-all-warnings
      - -Xreturn-value-checker=full
      - -Xcontext-sensitive-resolution
      - -Xconsistent-data-class-copy-visibility
      - -Xname-based-destructuring=complete
      - -Xexplicit-context-arguments
      # - -Xannotation-target-all
      # - -Xskip-prerelease-check
      # - -Xsuppress-warning=CAN_BE_VAL
      # - -Xwarning-level=UNCHECKED_CAST:error

      #compilerPlugins:
      # - id: com.javiersc.kotlin.kopy-compiler
      #   dependency: $libs.kopy.compilerPlugin
      # - id: io.exoquery.exoquery-plugin
      #   dependency: $libs.exoquery.compilerPlugin
      # - id: dev.zacsweers.redacted.compiler
      #   dependency: $libs.kotlin.redacted.compilerPlugin
      #   options:
      #     enabled: true
      #     replacementString: "█"
      #     redactedAnnotations: dev/zacsweers/redacted/annotations/Redacted
      #     unredactedAnnotations: dev/zacsweers/redacted/annotations/Unredacted

    optIns:
      - kotlin.ExperimentalStdlibApi
      - kotlin.ExperimentalUnsignedTypes
      - kotlin.contracts.ExperimentalContracts
      - kotlin.contracts.ExperimentalExtendedContracts
      - kotlin.io.encoding.ExperimentalEncodingApi
      - kotlin.time.ExperimentalTime
      - kotlinx.coroutines.ExperimentalCoroutinesApi
      - kotlinx.serialization.ExperimentalSerializationApi
      - kotlin.ExperimentalMultiplatform
      - kotlin.uuid.ExperimentalUuidApi
      - kotlin.concurrent.atomics.ExperimentalAtomicApi
      # - com.javiersc.kotlin.kopy.KopyOptIn
      # - io.opentelemetry.kotlin.ExperimentalApi

    serialization:
      version: 1.11.0
      format: json

    ksp:
      version: 2.3.9

    rpc:
      enabled: false
      version: 0.10.2
      annotationTypeSafetyEnabled: true

  publishing:
    enabled: true
    # artifactId: shared
    group: dev.suresh.amper
    version: 1.0.0-SNAPSHOT
    mavenCentral:
      enabled: false
      publishingMode: auto
    signArtifacts: true
    publishSources: true
    pom:
      url: https://github.com/sureshg/kmp-play
      scm: https://github.com/sureshg/kmp-play.git
      developers:
        - name: Suresh
          url: https://suresh.dev
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt

settings@jvm:
  java:
    compileIncrementally: true
    freeCompilerArgs:
      - -Xlint:all
      - --add-modules=jdk.incubator.vector
      - --enable-preview
    # annotationProcessing:
    #   processors:
    #     - $libs.google.auto.service
    #   processorOptions:
    #     - debug: "true"

  kotlin:
    freeCompilerArgs:
      - -Xno-param-assertions
      - -Xno-call-assertions
      - -Xno-receiver-assertions
      - -Xwhen-expressions=indy
      # - -Xjvm-enable-preview
      # - -Xjvm-expose-boxed
      # - -Xjdk-release=26
      # - -Xadd-modules=ALL-MODULE-PATH
      # - -Xmodule-path=
      # - -Xjavac-arguments="--add-exports java.base/sun.nio.ch=ALL-UNNAMED"
      # - -Xexplicit-api=strict
    ksp:
      processors:
        - $libs.ksp.auto.service

  jvm:
    test:
      junitPlatformVersion: 6.1.0
      freeJvmArgs:
        - --enable-preview
        - --enable-native-access=ALL-UNNAMED
        - --add-modules=jdk.incubator.vector
        - -Djunit.platform.reporting.open.xml.enabled=true
    # systemProperties:
    # extraEnvironment

settings@native:
  kotlin:
    debug: false
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlin.experimental.ExperimentalNativeApi

settings@linux:
  kotlin:
    # freeCompilerArgs:
    #   - -Xbinary=sourceInfoType=libbacktrace
    linkerOptions: [
      "-Wl,--as-needed",
      "-Wl,-Bstatic",
      "-lz",
      "-Wl,-Bdynamic"
    ]

settings@web:
  kotlin:
    freeCompilerArgs:
      - -Xwasm-use-new-exception-proposal
    optIns:
      - kotlin.js.ExperimentalJsExport
      - kotlin.js.ExperimentalWasmJsInterop

    jsPlainObjects: enabled

test-settings:
  kotlin:
    powerAssert:
      enabled: true
      functions:
        - kotlin.assert
        - kotlin.require
        - kotlin.test.assertTrue
        - kotlin.test.assertEquals
        - kotlin.test.assertNull
        - kotlin.test.assertContentEquals


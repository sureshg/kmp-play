apply:
  - //tmpl/common.module-template.yaml

settings:
  kotlin:
    freeCompilerArgs:
      - -Xwarning-level=REDUNDANT_VISIBILITY_MODIFIER:disabled

  compose:
    version: 1.12.0-rc01
    enabled: true
    experimental:
      hotReload:
        version: 1.2.0

dependencies:
  - //shared: exported
  - $libs.compose.foundation: exported
  - $libs.compose.material3: exported